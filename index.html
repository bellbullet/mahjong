<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>四人麻雀 — 雀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1410;
  --bg2: #161d18;
  --felt: #1f3a2d;
  --felt-dark: #142a20;
  --gold: #c8a45e;
  --gold-soft: #8a7340;
  --ink: #e8e1d0;
  --dim: #9a9282;
  --red: #b94a3a;
  --acc: #d4b370;
}
* { box-sizing: border-box; }
html,body { margin:0; padding:0; height:100%; overflow:hidden; }
body {
  background: radial-gradient(ellipse at top, #1c2620 0%, var(--bg) 60%), var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
body::before {
  content:''; position:fixed; inset:0;
  background-image: repeating-linear-gradient(45deg,transparent 0,transparent 2px,rgba(200,164,94,.012) 2px,rgba(200,164,94,.012) 4px);
  pointer-events:none; z-index:0;
}
.app {
  position:relative; height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  z-index:1; max-width:480px; margin:0 auto;
}

/* Header */
.header {
  padding:6px 12px 4px;
  border-bottom:1px solid rgba(200,164,94,.15);
}
.header-top {
  display:flex; justify-content:space-between; align-items:center;
}
.title {
  font-family:'Shippori Mincho',serif; font-weight:800;
  font-size:18px; color:var(--gold); letter-spacing:.12em;
}
.title small { font-size:9px; color:var(--dim); letter-spacing:.3em; margin-left:5px; }
.gameinfo { display:flex; gap:10px; font-size:10px; color:var(--dim); align-items:center; }
.gameinfo b { color:var(--acc); font-weight:700; }
.dora-wrap { display:inline-flex; align-items:center; gap:3px; }

/* Score bar */
.score-bar {
  display:grid; grid-template-columns:repeat(4,1fr); gap:2px;
  margin-top:4px;
}
.score-cell {
  background:rgba(200,164,94,.06); border:1px solid rgba(200,164,94,.12);
  border-radius:3px; padding:2px 4px; text-align:center;
  font-family:'Shippori Mincho',serif;
}
.score-cell .sname { font-size:9px; color:var(--dim); letter-spacing:.1em; }
.score-cell .spts { font-size:11px; color:var(--acc); font-weight:700; }
.score-cell.dealer { border-color:rgba(200,164,94,.4); }
.score-cell.me { border-color:rgba(200,164,94,.5); background:rgba(200,164,94,.1); }
.score-cell.me .sname { color:var(--gold); }

/* Table */
.table {
  flex:1;
  background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
  border-top:1px solid rgba(200,164,94,.2);
  border-bottom:1px solid rgba(200,164,94,.2);
  display:flex; flex-direction:column;
  overflow:hidden; position:relative;
}
.table::before {
  content:''; position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,.2) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,0,0,.15) 0%, transparent 50%);
  pointer-events:none;
}

/* CPU rows */
.cpus {
  display:flex; flex-direction:column; gap:2px;
  padding:6px 8px 3px; position:relative; z-index:1;
}
.cpu-row {
  display:flex; align-items:center; gap:5px;
}
.cpu-name {
  font-family:'Shippori Mincho',serif; font-size:10px; color:var(--dim);
  letter-spacing:.15em; min-width:28px; flex-shrink:0;
}
.cpu-tiles { display:flex; gap:1px; flex:1; }
.riichi-badge {
  display:inline-block; background:var(--red); color:#fff;
  padding:1px 5px; border-radius:2px; font-size:9px; letter-spacing:.05em;
  font-weight:700; flex-shrink:0;
}

/* River grid 2×2 */
.river-grid {
  display:grid; grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr; flex:1; gap:3px; padding:4px 8px;
  position:relative; z-index:1; min-height:0;
}
.river-cell {
  background:rgba(0,0,0,.15); border-radius:3px;
  padding:3px 4px; overflow:hidden;
  display:flex; flex-direction:column;
}
.river-label {
  font-size:8px; color:var(--dim); letter-spacing:.15em;
  font-family:'Shippori Mincho',serif; margin-bottom:2px; flex-shrink:0;
}
.river-tiles {
  display:flex; flex-wrap:wrap; gap:1px; align-content:flex-start;
}
.river-tiles .tile {
  transform:scale(.72); transform-origin:top left;
  margin:0 -7px -4px 0;
}
.river-tiles .tile.riichi-tile {
  transform:scale(.72) rotate(-90deg);
  margin:5px 10px -4px 0;
}

/* Center decoration */
.center-deco {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-family:'Shippori Mincho',serif; font-size:52px; font-weight:800;
  color:rgba(200,164,94,.04); pointer-events:none; z-index:0;
}

/* Player area */
.player-area {
  padding:3px 7px 6px; position:relative; z-index:1;
}
.player-label {
  font-family:'Shippori Mincho',serif; font-size:10px; color:var(--gold);
  letter-spacing:.2em; margin-bottom:3px;
  display:flex; justify-content:space-between; align-items:center;
}
.player-hand {
  display:flex; justify-content:center; align-items:flex-end;
  gap:1px; flex-wrap:nowrap; min-height:48px;
}
.player-hand .drawn { margin-left:5px; }

/* Tile */
.tile {
  width:26px; height:38px;
  background:linear-gradient(180deg,#f5ecd5 0%,#e8dcc0 100%);
  border-radius:3px; border:1px solid #8a7340;
  display:flex; align-items:center; justify-content:center;
  font-family:'Shippori Mincho',serif;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.4);
  transition:transform .1s; cursor:pointer; flex-shrink:0;
}
.tile:active { transform:translateY(2px); }
.tile.back {
  background:linear-gradient(180deg,#2d4a36 0%,#1f3527 100%);
  border-color:#0f1a14; cursor:default;
}
.tile.back::before { content:'◇'; color:rgba(200,164,94,.2); font-size:14px; }
.tile.mini { width:18px; height:26px; }
.tile.mini .tile-num { font-size:11px; }
.tile.mini .tile-suit { font-size:6px; }
.tile.mini.honor .tile-num { font-size:11px; }
.tile.back.mini::before { font-size:10px; }
.tile.disabled { cursor:default; }
.tile.tsumogiri { opacity:.7; }
.tile.dora-ind {
  background:linear-gradient(180deg,#fce8b8 0%,#e8c878 100%);
  border-color:#c89a40;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.1),0 0 6px rgba(200,164,94,.4),0 1px 2px rgba(0,0,0,.4);
}
.tile-content { display:flex; flex-direction:column; align-items:center; line-height:1; color:#1a1410; font-weight:700; }
.tile-num { font-size:16px; line-height:1; }
.tile-suit { font-size:8px; margin-top:1px; font-weight:500; color:#5a4a30; }
.tile.red .tile-num { color:var(--red); }
.tile.honor .tile-num { font-size:16px; }
.tile.winning-tile {
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.1),0 0 10px var(--gold),0 1px 2px rgba(0,0,0,.4) !important;
}

/* Action bar */
.action-bar {
  padding:7px 10px 11px;
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
  border-top:1px solid rgba(200,164,94,.15);
  display:flex; gap:6px; align-items:center; min-height:52px;
}
.btn {
  flex:1; padding:9px 4px;
  border:1px solid var(--gold-soft);
  background:linear-gradient(180deg,rgba(200,164,94,.15) 0%,rgba(200,164,94,.05) 100%);
  color:var(--gold); font-family:'Shippori Mincho',serif;
  font-size:13px; font-weight:700; letter-spacing:.12em;
  border-radius:4px; cursor:pointer; transition:all .15s;
}
.btn:active { transform:translateY(1px); }
.btn:disabled { opacity:.25; cursor:not-allowed; }
.btn.primary {
  background:linear-gradient(180deg,var(--red) 0%,#8a3026 100%);
  color:#fff; border-color:#8a3026;
}
.btn.rii {
  background:linear-gradient(180deg,#d4b370 0%,#8a7340 100%);
  color:#1a1410; border-color:#5a4a30;
}
.status {
  flex:1.5; text-align:center; color:var(--dim);
  font-size:10px; font-family:'Shippori Mincho',serif; letter-spacing:.1em;
}

/* Modal */
.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,.88);
  z-index:100; display:flex; align-items:center; justify-content:center;
  padding:16px; animation:fadeIn .3s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
  border:1px solid var(--gold-soft); border-radius:6px;
  padding:18px 16px; width:100%; max-width:360px; max-height:92vh; overflow-y:auto;
  position:relative;
}
.modal::before {
  content:''; position:absolute; inset:4px;
  border:1px solid rgba(200,164,94,.2); border-radius:4px; pointer-events:none;
}
.modal h2 { font-family:'Shippori Mincho',serif; font-size:20px; color:var(--gold); text-align:center; margin:0 0 3px; letter-spacing:.2em; }
.modal .sub { text-align:center; color:var(--dim); font-size:10px; letter-spacing:.3em; margin-bottom:12px; }
.yaku-list { margin:10px 0; padding:8px 2px; border-top:1px solid rgba(200,164,94,.2); border-bottom:1px solid rgba(200,164,94,.2); }
.yaku-row { display:flex; justify-content:space-between; padding:2px 0; font-size:12px; font-family:'Shippori Mincho',serif; }
.yaku-row .han { color:var(--acc); font-weight:700; }
.yaku-total { text-align:center; margin:10px 0; font-family:'Shippori Mincho',serif; }
.yaku-total .han-n { font-size:24px; color:var(--gold); font-weight:800; }
.yaku-total .pts { font-size:20px; color:var(--ink); margin-top:3px; font-weight:700; }
.yaku-total .rank { color:var(--red); font-size:12px; letter-spacing:.3em; margin-top:5px; }
.win-hand { display:flex; flex-wrap:wrap; justify-content:center; gap:1px; margin:8px 0; }
.win-hand .tile { transform:scale(.82); margin:0 -3px; }
.modal .btn { width:100%; margin-top:7px; }

/* Toast */
.toast {
  position:fixed; top:56px; left:50%; transform:translateX(-50%);
  background:rgba(20,30,24,.95); border:1px solid var(--gold);
  color:var(--gold); padding:7px 20px; font-family:'Shippori Mincho',serif;
  font-size:14px; letter-spacing:.2em; border-radius:4px;
  z-index:200; animation:tIn .25s ease, tOut .3s ease 1.7s forwards; pointer-events:none;
}
@keyframes tIn { from{opacity:0;transform:translate(-50%,-10px)} to{opacity:1;transform:translate(-50%,0)} }
@keyframes tOut { to{opacity:0;transform:translate(-50%,-10px)} }

@media (max-height:700px) { .tile{width:24px;height:34px} .tile-num{font-size:14px} }
@media (max-width:360px) { .tile{width:22px;height:32px} .tile-num{font-size:13px} }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="title">雀<small>JAKU</small></div>
      <div class="gameinfo">
        <div><b id="round-wind">東</b><b id="round-num">1</b>局</div>
        <div>山<b id="wall-count">70</b></div>
        <div class="dora-wrap">ドラ<span id="dora-tile"></span></div>
      </div>
    </div>
    <div class="score-bar" id="score-bar"></div>
  </div>

  <div class="table">
    <div class="center-deco">雀</div>
    <div class="cpus" id="cpus"></div>

    <div class="river-grid">
      <div class="river-cell">
        <div class="river-label" id="rlabel-3">北家 捨て牌</div>
        <div class="river-tiles" id="river-3"></div>
      </div>
      <div class="river-cell">
        <div class="river-label" id="rlabel-2">西家 捨て牌</div>
        <div class="river-tiles" id="river-2"></div>
      </div>
      <div class="river-cell">
        <div class="river-label" id="rlabel-0">あなた 捨て牌</div>
        <div class="river-tiles" id="river-0"></div>
      </div>
      <div class="river-cell">
        <div class="river-label" id="rlabel-1">南家 捨て牌</div>
        <div class="river-tiles" id="river-1"></div>
      </div>
    </div>

    <div class="player-area">
      <div class="player-label">
        <span>あなた (<span id="my-wind">東</span>家)</span>
        <span id="player-riichi" style="display:none" class="riichi-badge">立直</span>
      </div>
      <div class="player-hand" id="player-hand"></div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn rii" id="btn-riichi" disabled>立直</button>
    <button class="btn primary" id="btn-tsumo" disabled>ツモ</button>
    <button class="btn primary" id="btn-ron" disabled style="display:none">ロン</button>
    <button class="btn" id="btn-pass" disabled style="display:none">パス</button>
    <div class="status" id="status">配牌中…</div>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 牌定義 0-8:1m-9m, 9-17:1p-9p, 18-26:1s-9s, 27-30:東南西北, 31-33:白發中
// ============================================================
const KANJI = ['一','二','三','四','五','六','七','八','九'];
const PIN = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
const SOU = ['1','2','3','4','5','6','7','8','9'];
const HONORS = ['東','南','西','北','白','發','中'];
const YAOCHU = [0,8,9,17,18,26,27,28,29,30,31,32,33];
const WIND_NAMES = ['東','南','西','北'];
const SEAT_NAMES = ['東家','南家','西家','北家'];

function isHonor(t){ return t>=27; }
function isTerminal(t){ return !isHonor(t)&&(t%9===0||t%9===8); }
function isYaochu(t){ return isHonor(t)||isTerminal(t); }
function isDragon(t){ return t>=31&&t<=33; }
function isWind(t){ return t>=27&&t<=30; }
function tileSuit(t){ return t<27?Math.floor(t/9):3; }

function nextTile(t){
  if(t<27){ const s=Math.floor(t/9),n=t%9; return s*9+(n===8?0:n+1); }
  if(t<=30) return 27+((t-27+1)%4);
  return 31+((t-31+1)%3);
}

function tileEl(t, opts={}){
  const div = document.createElement('div');
  div.className = 'tile';
  if(opts.mini) div.classList.add('mini');
  if(opts.back){ div.classList.add('back'); return div; }
  if(opts.disabled) div.classList.add('disabled');
  if(opts.doraInd) div.classList.add('dora-ind');
  if(opts.tsumogiri) div.classList.add('tsumogiri');
  if(opts.riichi) div.classList.add('riichi-tile');
  if(opts.winning) div.classList.add('winning-tile');
  const c = document.createElement('div');
  c.className = 'tile-content';
  if(t<9){
    const n=document.createElement('div'); n.className='tile-num'; n.textContent=KANJI[t];
    const s=document.createElement('div'); s.className='tile-suit'; s.textContent='萬';
    c.append(n,s);
  } else if(t<18){
    const n=document.createElement('div'); n.className='tile-num'; n.textContent=PIN[t-9];
    c.append(n);
  } else if(t<27){
    const n=document.createElement('div'); n.className='tile-num'; n.textContent=SOU[t-18];
    const s=document.createElement('div'); s.className='tile-suit'; s.textContent='索';
    c.append(n,s);
    div.classList.add('red');
  } else {
    div.classList.add('honor');
    const n=document.createElement('div'); n.className='tile-num'; n.textContent=HONORS[t-27];
    if(t===33) div.classList.add('red');
    c.append(n);
  }
  div.appendChild(c);
  if(opts.onClick) div.addEventListener('click', opts.onClick);
  return div;
}

// ============================================================
// 山・ユーティリティ
// ============================================================
function makeWall(){
  const w=[];
  for(let i=0;i<34;i++) for(let j=0;j<4;j++) w.push(i);
  for(let i=w.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [w[i],w[j]]=[w[j],w[i]]; }
  return w;
}
function toCounts(hand){
  const c=new Array(34).fill(0);
  for(const t of hand) c[t]++;
  return c;
}
function sortHand(hand){ return [...hand].sort((a,b)=>a-b); }

// ============================================================
// 和了判定
// ============================================================
function findDecomps(counts0){
  const decomps=[]; const counts=[...counts0];
  for(let pair=0;pair<34;pair++){
    if(counts[pair]<2) continue;
    counts[pair]-=2;
    const melds=[];
    if(tryMelds(counts,4,melds)) decomps.push({pair,melds:melds.map(m=>({...m}))});
    counts[pair]+=2;
  }
  return decomps;
}
function tryMelds(c,n,melds){
  if(n===0) return c.every(x=>x===0);
  let i=-1; for(let k=0;k<34;k++) if(c[k]>0){i=k;break;}
  if(i<0) return false;
  if(c[i]>=3){
    c[i]-=3; melds.push({type:'triplet',tile:i});
    if(tryMelds(c,n-1,melds)) return true;
    melds.pop(); c[i]+=3;
  }
  if(i<27&&(i%9)<=6&&c[i+1]>0&&c[i+2]>0){
    c[i]--; c[i+1]--; c[i+2]--;
    melds.push({type:'sequence',tile:i});
    if(tryMelds(c,n-1,melds)) return true;
    melds.pop(); c[i]++; c[i+1]++; c[i+2]++;
  }
  return false;
}
function isChiitoitsu(c){
  let p=0;
  for(let i=0;i<34;i++){
    if(c[i]===2) p++;
    else if(c[i]!==0) return false;
  }
  return p===7;
}
function isKokushi(c){
  let total=0,pairFound=false;
  for(let i=0;i<34;i++){
    if(YAOCHU.includes(i)){
      if(c[i]===0) return false;
      if(c[i]===2) pairFound=true;
      else if(c[i]!==1) return false;
      total+=c[i];
    } else if(c[i]!==0) return false;
  }
  return pairFound&&total===14;
}
function checkAgari(hand){
  if(hand.length!==14) return null;
  const c=toCounts(hand);
  if(isKokushi(c)) return {type:'kokushi'};
  if(isChiitoitsu(c)) return {type:'chiitoitsu'};
  const decomps=findDecomps(c);
  if(decomps.length>0) return {type:'standard',decomps};
  return null;
}
function getWaits(hand13){
  if(hand13.length!==13) return [];
  const c=toCounts(hand13);
  const waits=[];
  for(let t=0;t<34;t++){
    if(c[t]>=4) continue;
    c[t]++;
    if(isKokushi(c)||isChiitoitsu(c)||findDecomps(c).length>0) waits.push(t);
    c[t]--;
  }
  return waits;
}

// ============================================================
// シャンテン（CPU AI用近似）
// ============================================================
function shantenFast(hand){
  const c=toCounts(hand);
  let best=8;
  for(let pair=-1;pair<34;pair++){
    const cc=[...c]; let hasPair=false;
    if(pair>=0){ if(cc[pair]<2) continue; cc[pair]-=2; hasPair=true; }
    let melds=0; const c2=[...cc];
    for(let i=0;i<34;i++) while(c2[i]>=3){c2[i]-=3;melds++;}
    for(let i=0;i<25;i++){ if(i%9>6) continue; while(c2[i]>0&&c2[i+1]>0&&c2[i+2]>0){c2[i]--;c2[i+1]--;c2[i+2]--;melds++;} }
    let parts=0;
    for(let i=0;i<34;i++) while(c2[i]>=2){c2[i]-=2;parts++;}
    for(let i=0;i<26;i++) if(i%9<=7&&c2[i]>0&&c2[i+1]>0){c2[i]--;c2[i+1]--;parts++;}
    for(let i=0;i<25;i++) if(i%9<=6&&c2[i]>0&&c2[i+2]>0){c2[i]--;c2[i+2]--;parts++;}
    const need=4-melds;
    const s=8-2*melds-Math.min(parts,need)-(hasPair?1:0);
    if(s<best) best=s;
  }
  // 七対子
  let pairs=0,kinds=0;
  for(let i=0;i<34;i++){if(c[i]>=2)pairs++;if(c[i]>=1)kinds++;}
  const cs=6-pairs+Math.max(0,7-kinds);
  if(cs<best) best=cs;
  // 国士
  let yk=0,yp=false;
  for(const t of YAOCHU){if(c[t]>=1)yk++;if(c[t]>=2)yp=true;}
  const ks=13-yk-(yp?1:0);
  if(ks<best) best=ks;
  return best;
}

// ============================================================
// 役判定
// ============================================================
function evalYaku(hand14, winTile, st){
  // st: {isTsumo, isRiichi, isIppatsu, seatWind, roundWind, isMenzen, doraTile}
  const c=toCounts(hand14);
  // 国士
  if(isKokushi(c)){
    const r={yaku:[{name:'国士無双',han:13}],han:13,isYakuman:true};
    addDora(r,hand14,st); return r;
  }
  // 七対子
  let cResult=null;
  if(isChiitoitsu(c)){
    cResult={yaku:[],han:0,isYakuman:false};
    cResult.yaku.push({name:'七対子',han:2});
    if(st.isRiichi) cResult.yaku.push({name:'立直',han:1});
    if(st.isIppatsu) cResult.yaku.push({name:'一発',han:1});
    if(st.isTsumo&&st.isMenzen) cResult.yaku.push({name:'門前清自摸和',han:1});
    if(hand14.every(t=>!isYaochu(t))) cResult.yaku.push({name:'断幺九',han:1});
    if(hand14.every(t=>isHonor(t))){
      cResult={yaku:[{name:'字一色',han:13}],han:13,isYakuman:true};
    } else {
      const suits=new Set(); let hasH=false;
      for(const t of hand14){if(isHonor(t))hasH=true;else suits.add(tileSuit(t));}
      if(suits.size===1&&!hasH) cResult.yaku.push({name:'清一色',han:6});
      else if(suits.size===1&&hasH) cResult.yaku.push({name:'混一色',han:3});
    }
    cResult.han=cResult.yaku.reduce((s,y)=>s+y.han,0);
    if(!cResult.isYakuman) addDora(cResult,hand14,st);
  }
  // 標準形
  const decomps=findDecomps(c);
  let best=null;
  for(const d of decomps){
    const r=evalStandard(hand14,winTile,st,d);
    if(!r.isYakuman) addDora(r,hand14,st);
    if(!best||(r.isYakuman&&!best.isYakuman)||(!best.isYakuman&&!r.isYakuman&&r.han>best.han)||(r.isYakuman&&best.isYakuman&&r.han>best.han)) best=r;
  }
  if(cResult&&best){
    if(cResult.isYakuman&&!best.isYakuman) return cResult;
    if(best.isYakuman&&!cResult.isYakuman) return best;
    return cResult.han>best.han?cResult:best;
  }
  return cResult||best||{yaku:[],han:0,isYakuman:false};
}

function evalStandard(hand14,winTile,st,decomp){
  const {pair,melds}=decomp;
  const trips=melds.filter(m=>m.type==='triplet');
  // 役満チェック
  // 四暗刻
  if(trips.length===4&&st.isMenzen&&st.isTsumo)
    return {yaku:[{name:'四暗刻',han:13}],han:13,isYakuman:true};
  // 大三元
  if(trips.filter(m=>isDragon(m.tile)).length===3)
    return {yaku:[{name:'大三元',han:13}],han:13,isYakuman:true};
  // 字一色
  if(hand14.every(t=>isHonor(t)))
    return {yaku:[{name:'字一色',han:13}],han:13,isYakuman:true};
  // 清老頭
  if(hand14.every(t=>isTerminal(t)))
    return {yaku:[{name:'清老頭',han:13}],han:13,isYakuman:true};
  // 緑一色
  const green=[19,20,21,23,25,32];
  if(hand14.every(t=>green.includes(t)))
    return {yaku:[{name:'緑一色',han:13}],han:13,isYakuman:true};

  const r={yaku:[],han:0,isYakuman:false};
  if(st.isRiichi) r.yaku.push({name:'立直',han:1});
  if(st.isIppatsu) r.yaku.push({name:'一発',han:1});
  if(st.isTsumo&&st.isMenzen) r.yaku.push({name:'門前清自摸和',han:1});
  // タンヤオ
  if(hand14.every(t=>!isYaochu(t))) r.yaku.push({name:'断幺九',han:1});
  // 役牌
  for(const m of trips){
    if(isDragon(m.tile)){
      r.yaku.push({name:['役牌(白)','役牌(發)','役牌(中)'][m.tile-31],han:1});
    } else if(isWind(m.tile)){
      if(m.tile===st.seatWind) r.yaku.push({name:'役牌(自風)',han:1});
      if(m.tile===st.roundWind&&m.tile!==st.seatWind) r.yaku.push({name:'役牌(場風)',han:1});
    }
  }
  // 平和
  if(st.isMenzen&&melds.every(m=>m.type==='sequence')){
    const pairBad=isDragon(pair)||(isWind(pair)&&(pair===st.seatWind||pair===st.roundWind));
    if(!pairBad){
      let ryanmen=false;
      for(const m of melds){
        const sn=m.tile%9;
        if(winTile===m.tile&&sn!==6){ryanmen=true;break;}
        if(winTile===m.tile+2&&sn!==0){ryanmen=true;break;}
      }
      if(ryanmen) r.yaku.push({name:'平和',han:1});
    }
  }
  // 一盃口/二盃口
  if(st.isMenzen){
    const sm={};
    for(const m of melds.filter(m=>m.type==='sequence')) sm[m.tile]=(sm[m.tile]||0)+1;
    const pp=Object.values(sm).filter(v=>v>=2).length;
    if(pp>=2) r.yaku.push({name:'二盃口',han:3});
    else if(pp===1) r.yaku.push({name:'一盃口',han:1});
  }
  // 三色同順
  const seqs=new Set(melds.filter(m=>m.type==='sequence').map(m=>m.tile));
  for(let n=0;n<=6;n++) if(seqs.has(n)&&seqs.has(n+9)&&seqs.has(n+18)){r.yaku.push({name:'三色同順',han:st.isMenzen?2:1});break;}
  // 三色同刻
  const trS=new Set(trips.map(m=>m.tile));
  for(let n=0;n<=8;n++) if(trS.has(n)&&trS.has(n+9)&&trS.has(n+18)){r.yaku.push({name:'三色同刻',han:2});break;}
  // 一気通貫
  for(let s=0;s<3;s++) if(seqs.has(s*9)&&seqs.has(s*9+3)&&seqs.has(s*9+6)){r.yaku.push({name:'一気通貫',han:st.isMenzen?2:1});break;}
  // 対々和
  if(trips.length===4) r.yaku.push({name:'対々和',han:2});
  // 混老頭
  if(hand14.every(t=>isYaochu(t))&&trips.length===4) r.yaku.push({name:'混老頭',han:2});
  // チャンタ/純チャン
  const blocks=[...melds.map(m=>m.type==='triplet'?[m.tile,m.tile,m.tile]:[m.tile,m.tile+1,m.tile+2]),[pair,pair]];
  const allHaveY=blocks.every(b=>b.some(t=>isYaochu(t)));
  if(allHaveY&&!hand14.every(t=>isYaochu(t))){
    const noH=hand14.every(t=>!isHonor(t));
    if(noH) r.yaku.push({name:'純全帯幺九',han:st.isMenzen?3:2});
    else r.yaku.push({name:'混全帯幺九',han:st.isMenzen?2:1});
  }
  // 混一色/清一色
  const suits=new Set(); let hasH=false;
  for(const t of hand14){if(isHonor(t))hasH=true;else suits.add(tileSuit(t));}
  if(suits.size===1&&!hasH) r.yaku.push({name:'清一色',han:st.isMenzen?6:5});
  else if(suits.size===1&&hasH) r.yaku.push({name:'混一色',han:st.isMenzen?3:2});

  r.han=r.yaku.reduce((s,y)=>s+y.han,0);
  return r;
}

function addDora(r,hand14,st){
  if(st.doraTile===undefined) return;
  let d=0; for(const t of hand14) if(t===st.doraTile) d++;
  if(d>0){ r.yaku.push({name:`ドラ${d}`,han:d}); r.han=r.yaku.reduce((s,y)=>s+y.han,0); }
}
function hasYaku(r){ return r.yaku.some(y=>!y.name.startsWith('ドラ')); }

// ============================================================
// 点数計算
// ============================================================
function ronScore(han, isYakuman, isDealer){
  if(isYakuman) return isDealer?48000:32000;
  if(han>=13) return isDealer?48000:32000;
  if(han>=11) return isDealer?36000:24000;
  if(han>=8) return isDealer?24000:16000;
  if(han>=6) return isDealer?18000:12000;
  if(han>=5||han===4) return isDealer?12000:8000;
  if(han===3) return isDealer?7700:3900;
  if(han===2) return isDealer?3900:2000;
  return isDealer?1500:1000;
}
function rankName(han,isYakuman){
  if(isYakuman) return '役満';
  if(han>=13) return '数え役満';
  if(han>=11) return '三倍満';
  if(han>=8) return '倍満';
  if(han>=6) return '跳満';
  if(han>=5||han===4) return '満貫';
  return '';
}
// ツモ支払い: {dealerPays, eachChildPays}
function tsumoPayments(han, isYakuman, winnerIsDealer){
  const total=ronScore(han,isYakuman,winnerIsDealer);
  if(winnerIsDealer){
    const each=Math.ceil(total/3/100)*100;
    return {dealerPays:0,eachChildPays:each,total:each*3};
  } else {
    const child=Math.ceil(total/4/100)*100;
    const dealer=child*2;
    return {dealerPays:dealer,eachChildPays:child,total:dealer+child*2};
  }
}

// ============================================================
// CPU AI 打牌選択
// ============================================================
function cpuChooseDiscard(hand14){
  let best=100; const cands=[];
  for(let i=0;i<hand14.length;i++){
    const t=[...hand14]; t.splice(i,1);
    const s=shantenFast(t);
    if(s<best){best=s;cands.length=0;cands.push(i);}
    else if(s===best) cands.push(i);
  }
  cands.sort((a,b)=>{
    const ta=hand14[a],tb=hand14[b];
    if(isHonor(ta)!==isHonor(tb)) return isHonor(ta)?-1:1;
    if(isTerminal(ta)!==isTerminal(tb)) return isTerminal(ta)?-1:1;
    return 0;
  });
  return cands[0];
}
function cpuCanRiichi(hand14){
  if(G.wall.length<4) return false;
  for(let i=0;i<14;i++){
    const t=[...hand14]; t.splice(i,1);
    if(getWaits(t).length>0) return true;
  }
  return false;
}

// ============================================================
// ゲーム状態
// ============================================================
// player index: 0=human, 1=CPU南, 2=CPU西, 3=CPU北
let G=null;
let scores=[25000,25000,25000,25000];
let dealer=0; // 東家のindex
let roundWind=27; // 東場
let roundNum=1;

function seatWind(idx){
  // 東家からの距離 → 27+offset
  return 27+((idx-dealer+4)%4);
}
function seatName(idx){ return SEAT_NAMES[(idx-dealer+4)%4]; }
function windKanji(w){ return WIND_NAMES[w-27]; }

function newRound(){
  const wall=makeWall();
  const hands=[
    sortHand(wall.splice(0,13)),
    sortHand(wall.splice(0,13)),
    sortHand(wall.splice(0,13)),
    sortHand(wall.splice(0,13)),
  ];
  const doraInd=wall.pop();
  G={
    wall,
    hands,              // hands[i] は常に14または13枚
    rivers:[[],[],[],[]],
    riichi:[false,false,false,false],
    ippatsu:[false,false,false,false],
    pendingRiichi:false,
    drawnIsLast:false,  // hand[0] の末尾がツモ牌か
    doraInd,
    doraTile:nextTile(doraInd),
    currentTurn:dealer,
    lastDiscard:null,
    lastDiscardBy:-1,
    canRon:false,
    over:false,
    _winResult:null,
  };
  document.getElementById('player-riichi').style.display='none';
  for(let i=1;i<=3;i++){
    const el=document.getElementById(`cpu-riichi-${i}`);
    if(el) el.style.display='none';
  }
  render();
  startTurn();
}

// ============================================================
// ターン管理
// ============================================================
function startTurn(){
  if(G.over) return;
  if(G.wall.length===0){endRoundDraw();return;}
  const turn=G.currentTurn;
  if(turn===0){
    // プレイヤー ツモ
    const t=G.wall.pop();
    G.hands[0].push(t);
    G.drawnIsLast=true;
    render();
    // ツモあがり?
    const wr=evalFor(0,t,true);
    if(wr&&hasYaku(wr)){
      G._winResult=wr;
      enableBtn('btn-tsumo',true);
    } else {
      G._winResult=null;
      enableBtn('btn-tsumo',false);
    }
    // 立直可能?
    if(!G.riichi[0]&&!G.pendingRiichi&&cpuCanRiichi(G.hands[0])){
      enableBtn('btn-riichi',true);
    } else {
      enableBtn('btn-riichi',false);
    }
    setStatus(G.riichi[0]?'立直中':'あなたの番');
  } else {
    // CPUターン
    setStatus(`${seatName(turn)} の番`);
    enableBtn('btn-tsumo',false);
    enableBtn('btn-riichi',false);
    setTimeout(()=>cpuTurn(turn), 700);
  }
}

function cpuTurn(idx){
  if(G.over||G.wall.length===0){endRoundDraw();return;}
  const t=G.wall.pop();
  G.hands[idx].push(t);
  G.hands[idx]=sortHand(G.hands[idx]);

  // ツモあがりチェック
  const twr=evalFor(idx,t,true);
  if(twr&&hasYaku(twr)){
    render();
    doWin(idx,twr,G.hands[idx],t,true,-1);
    return;
  }

  // 立直宣言
  if(!G.riichi[idx]&&G.wall.length>4&&cpuCanRiichi(G.hands[idx])){
    if(Math.random()<0.8){
      G.riichi[idx]=true;
      G.ippatsu[idx]=true;
      scores[idx]-=1000;
      showToast(`${seatName(idx)} 立直！`);
    }
  }

  // 打牌
  let discIdx;
  if(G.riichi[idx]){
    discIdx=G.hands[idx].indexOf(t);
    if(discIdx<0) discIdx=G.hands[idx].length-1;
  } else {
    discIdx=cpuChooseDiscard(G.hands[idx]);
  }
  const discarded=G.hands[idx][discIdx];
  const isTsumogiri=(discarded===t);
  G.hands[idx].splice(discIdx,1);
  G.rivers[idx].push({tile:discarded,tsumogiri:isTsumogiri,riichi:G.riichi[idx]&&G.rivers[idx].filter(r=>r.riichi).length===0});
  G.lastDiscard=discarded;
  G.lastDiscardBy=idx;
  G.ippatsu[idx]=false;
  render();

  // ロンチェック: 打牌後に全員チェック
  afterDiscard(idx);
}

function afterDiscard(discardedBy){
  // 時計回りで近い順にチェック
  const cands=[];
  for(let i=1;i<=3;i++){
    const idx=(discardedBy+i)%4;
    if(idx===discardedBy) continue;
    const hand13=G.hands[idx]; // 既に13枚
    if(hand13.length!==13) continue;
    const wr=evalRon(idx,G.lastDiscard);
    if(wr&&hasYaku(wr)) cands.push({idx,wr});
  }

  if(cands.length===0){
    G.currentTurn=(discardedBy+1)%4;
    // 次の番の人の一発を消す（他家の打牌が入った）
    G.ippatsu[G.currentTurn]=false;
    startTurn();
    return;
  }

  // プレイヤー (0) がロン可能かつ最初の候補?
  const firstCand=cands[0];
  if(firstCand.idx===0){
    // プレイヤーに選択させる（他にCPU候補がいても頭ハネ待ち）
    G.canRon=true;
    G._winResult=firstCand.wr;
    G._ronCandidatesAfterPass=cands.slice(1); // プレイヤーがパスしたときのCPU候補
    showRonPrompt();
  } else {
    // CPU自動ロン
    doWin(firstCand.idx,firstCand.wr,[...G.hands[firstCand.idx],G.lastDiscard],G.lastDiscard,false,discardedBy);
  }
}

function showRonPrompt(){
  document.getElementById('btn-tsumo').style.display='none';
  document.getElementById('btn-ron').style.display='';
  document.getElementById('btn-pass').style.display='';
  enableBtn('btn-ron',true);
  enableBtn('btn-pass',true);
  enableBtn('btn-riichi',false);
  setStatus('ロン可能！');
}

function hideRonPrompt(){
  document.getElementById('btn-tsumo').style.display='';
  document.getElementById('btn-ron').style.display='none';
  document.getElementById('btn-pass').style.display='none';
}

// ============================================================
// 和了評価ヘルパー
// ============================================================
function evalFor(idx,winTile,isTsumo){
  const hand=G.hands[idx];
  if(hand.length!==14) return null;
  if(!checkAgari(hand)) return null;
  return evalYaku(hand,winTile,{
    isTsumo, isRiichi:G.riichi[idx], isIppatsu:G.ippatsu[idx],
    seatWind:seatWind(idx), roundWind, isMenzen:true, doraTile:G.doraTile
  });
}
function evalRon(idx,tile){
  if(G.hands[idx].length!==13) return null;
  const h14=[...G.hands[idx],tile];
  if(!checkAgari(h14)) return null;
  return evalYaku(h14,tile,{
    isTsumo:false, isRiichi:G.riichi[idx], isIppatsu:G.ippatsu[idx],
    seatWind:seatWind(idx), roundWind, isMenzen:true, doraTile:G.doraTile
  });
}

// ============================================================
// プレイヤーアクション
// ============================================================
function onPlayerDiscard(i){
  if(G.currentTurn!==0||G.over||G.canRon) return;
  if(G.hands[0].length!==14) return;
  // 立直後はツモ切りのみ
  if(G.riichi[0]&&i!==13){showToast('立直後はツモ切りのみ');return;}
  // 立直宣言中: テンパイ維持チェック
  if(G.pendingRiichi){
    const test=[...G.hands[0]]; test.splice(i,1);
    if(getWaits(test).length===0){showToast('その牌では立直できません');return;}
    G.riichi[0]=true; G.ippatsu[0]=true; scores[0]-=1000;
    G.pendingRiichi=false;
    document.getElementById('player-riichi').style.display='inline-block';
    showToast('立直！');
  }
  const discarded=G.hands[0][i];
  const isTsumogiri=G.drawnIsLast&&i===13;
  G.hands[0].splice(i,1);
  G.drawnIsLast=false;
  G.rivers[0].push({tile:discarded,tsumogiri:isTsumogiri,riichi:G.riichi[0]&&G.rivers[0].filter(r=>r.riichi).length===0});
  G.lastDiscard=discarded; G.lastDiscardBy=0;
  G.ippatsu[0]=false;
  render();
  enableBtn('btn-tsumo',false); enableBtn('btn-riichi',false);
  afterDiscard(0);
}

function onTsumo(){
  if(!G._winResult||G.canRon) return;
  const winTile=G.hands[0][G.hands[0].length-1];
  doWin(0,G._winResult,[...G.hands[0]],winTile,true,-1);
}
function onRon(){
  if(!G._winResult||!G.canRon) return;
  doWin(0,G._winResult,[...G.hands[0],G.lastDiscard],G.lastDiscard,false,G.lastDiscardBy);
}
function onPass(){
  if(!G.canRon) return;
  G.canRon=false;
  G.ippatsu[0]=false; // 見逃し→一発消失
  hideRonPrompt();
  // 他のCPU候補があればそちらをロン
  const remaining=G._ronCandidatesAfterPass||[];
  G._ronCandidatesAfterPass=[];
  if(remaining.length>0){
    const c=remaining[0];
    doWin(c.idx,c.wr,[...G.hands[c.idx],G.lastDiscard],G.lastDiscard,false,G.lastDiscardBy);
    return;
  }
  G.currentTurn=(G.lastDiscardBy+1)%4;
  startTurn();
}
function onRiichi(){
  if(G.riichi[0]||G.pendingRiichi) return;
  G.pendingRiichi=true;
  enableBtn('btn-riichi',false);
  showToast('立直宣言！打牌を選択');
}

// ============================================================
// 和了処理
// ============================================================
function doWin(winnerIdx,result,hand,winTile,isTsumo,discardedBy){
  G.over=true;
  const winnerIsDealer=(dealer===winnerIdx);

  if(isTsumo){
    const pay=tsumoPayments(result.han,result.isYakuman,winnerIsDealer);
    let received=0;
    for(let i=0;i<4;i++){
      if(i===winnerIdx) continue;
      const amt=(i===dealer&&!winnerIsDealer)?pay.dealerPays:pay.eachChildPays;
      scores[i]-=amt;
      received+=amt;
    }
    scores[winnerIdx]+=received;
  } else {
    const loserIdx=discardedBy;
    const total=ronScore(result.han,result.isYakuman,winnerIsDealer);
    scores[loserIdx]-=total;
    scores[winnerIdx]+=total;
  }

  showWinModal(winnerIdx,result,hand,winTile,isTsumo,discardedBy);
}

// ============================================================
// 流局
// ============================================================
function endRoundDraw(){
  G.over=true;
  const tenpai=[];
  for(let i=0;i<4;i++){
    const h=G.hands[i].length===14?G.hands[i].slice(0,13):G.hands[i];
    if(getWaits(h).length>0) tenpai.push(i);
  }
  // テンパイ料: テンパイ者 vs ノーテン者 で3000点を分配
  const tNo=4-tenpai.length;
  if(tenpai.length>0&&tenpai.length<4){
    const gain=Math.floor(3000/tenpai.length);
    const loss=Math.floor(3000/tNo);
    for(let i=0;i<4;i++){
      if(tenpai.includes(i)) scores[i]+=gain;
      else scores[i]-=loss;
    }
  }
  const names=['あなた','南家','西家','北家'];
  const tenpaiStr=tenpai.map(i=>seatName(i)).join('・')||'全員ノーテン';
  showModal(`
    <h2>流局</h2>
    <div class="sub">RYUUKYOKU</div>
    <div style="text-align:center;margin:12px 0;font-family:'Shippori Mincho',serif;font-size:13px;color:var(--acc);">テンパイ: ${tenpaiStr}</div>
    ${scoreTable()}
    <button class="btn primary" id="next-btn">次の局へ</button>
  `);
  document.getElementById('next-btn').addEventListener('click',nextRound);
}

function scoreTable(){
  return `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin:10px 0;">
    ${[0,1,2,3].map(i=>`<div style="background:rgba(200,164,94,.08);border:1px solid rgba(200,164,94,.2);border-radius:3px;padding:4px 6px;font-family:'Shippori Mincho',serif;">
      <div style="font-size:9px;color:var(--dim);letter-spacing:.15em;">${seatName(i)}${i===dealer?' ●':''}</div>
      <div style="font-size:14px;color:var(--acc);font-weight:700;">${scores[i].toLocaleString()}</div>
    </div>`).join('')}
  </div>`;
}

function nextRound(){
  closeModal();
  // 連荘/局進行（簡易: 非dealer勝ちまたは流局でないとき dealer次の人へ）
  // ここでは常に dealer++（輪荘）
  dealer=(dealer+1)%4;
  roundNum++;
  if(roundNum>5&&dealer===0) roundWind=28; // 南場へ（簡易）
  newRound();
}

// ============================================================
// 勝利モーダル
// ============================================================
function showWinModal(winnerIdx,result,hand,winTile,isTsumo,discardedBy){
  const winnerIsDealer=(dealer===winnerIdx);
  const total=isTsumo?
    (()=>{const p=tsumoPayments(result.han,result.isYakuman,winnerIsDealer);return p.total;})():
    ronScore(result.han,result.isYakuman,winnerIsDealer);

  const winnerName=winnerIdx===0?'あなた':seatName(winnerIdx);
  const method=isTsumo?'ツモ':'ロン';
  const sorted=sortHand(hand);

  let handHtml='<div class="win-hand">';
  let hlit=false;
  for(const t of sorted){
    const isW=!hlit&&t===winTile; if(isW) hlit=true;
    const tmp=document.createElement('div');
    tmp.appendChild(tileEl(t,{disabled:true,winning:isW}));
    handHtml+=tmp.innerHTML;
  }
  handHtml+='</div>';

  const doraHtml=`<div style="display:flex;justify-content:center;align-items:center;gap:5px;margin:6px 0;font-size:10px;color:var(--dim);font-family:'Shippori Mincho',serif;letter-spacing:.15em;">ドラ表示牌 ${(()=>{const d=document.createElement('div');d.appendChild(tileEl(G.doraInd,{disabled:true,doraInd:true,mini:true}));return d.innerHTML;})()}</div>`;

  const yakuHtml=result.yaku.map(y=>`<div class="yaku-row"><span>${y.name}</span><span class="han">${y.han}翻</span></div>`).join('');
  const rank=rankName(result.han,result.isYakuman);

  const payHtml=isTsumo?(()=>{
    const p=tsumoPayments(result.han,result.isYakuman,winnerIsDealer);
    if(winnerIsDealer) return `<div style="font-size:10px;color:var(--dim);font-family:'Shippori Mincho',serif;text-align:center;">各自 ${p.eachChildPays.toLocaleString()}点</div>`;
    return `<div style="font-size:10px;color:var(--dim);font-family:'Shippori Mincho',serif;text-align:center;">親 ${p.dealerPays.toLocaleString()} / 子各 ${p.eachChildPays.toLocaleString()}点</div>`;
  })():'';

  showModal(`
    <h2>${winnerName} ${method}</h2>
    <div class="sub">${isTsumo?'自摸和了':'栄和'} · ${!isTsumo&&discardedBy>=0?(discardedBy===0?'あなた':seatName(discardedBy))+'の放銃':''}</div>
    ${handHtml}
    ${doraHtml}
    <div class="yaku-list">${yakuHtml}</div>
    <div class="yaku-total">
      <div class="han-n">${result.isYakuman?'役満':result.han+'翻'}</div>
      <div class="pts">${total.toLocaleString()}点</div>
      ${rank?`<div class="rank">${rank}</div>`:''}
      ${payHtml}
    </div>
    ${scoreTable()}
    <button class="btn primary" id="next-btn">次の局へ</button>
  `);
  document.getElementById('next-btn').addEventListener('click',nextRound);
}

// ============================================================
// UI helpers
// ============================================================
function showModal(html){
  closeModal();
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal-bg';
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=html;
  bg.appendChild(m); document.body.appendChild(bg);
}
function closeModal(){ const m=document.getElementById('modal-bg'); if(m) m.remove(); }
function setStatus(s){ document.getElementById('status').textContent=s; }
function enableBtn(id,v){ document.getElementById(id).disabled=!v; }
function showToast(msg){
  const e=document.querySelector('.toast'); if(e) e.remove();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{if(t.parentNode)t.remove();},2200);
}

// ============================================================
// レンダリング
// ============================================================
function render(){
  // スコアバー
  const sb=document.getElementById('score-bar');
  sb.innerHTML='';
  // スコア順: 0,1,2,3 を席順に合わせて表示
  for(let i=0;i<4;i++){
    const cell=document.createElement('div');
    cell.className='score-cell';
    if(i===dealer) cell.classList.add('dealer');
    if(i===0) cell.classList.add('me');
    cell.innerHTML=`<div class="sname">${seatName(i)}${i===dealer?'●':''}</div><div class="spts">${scores[i].toLocaleString()}</div>`;
    sb.appendChild(cell);
  }

  // ドラ表示
  const doraEl=document.getElementById('dora-tile');
  doraEl.innerHTML='';
  doraEl.appendChild(tileEl(G.doraInd,{disabled:true,doraInd:true,mini:true}));
  document.getElementById('round-num').textContent=roundNum;
  document.getElementById('round-wind').textContent=windKanji(roundWind);
  document.getElementById('wall-count').textContent=G.wall.length;

  // プレイヤーの席風
  document.getElementById('my-wind').textContent=windKanji(seatWind(0));

  // CPU手牌 (3人)
  const cpusEl=document.getElementById('cpus');
  cpusEl.innerHTML='';
  // 対面順に表示: 西家(idx=2)→北家(idx=3)→南家(idx=1) 的確に対面→左→右
  // 画面上: 視覚的に対面が先、次に上家・下家
  const displayOrder=[2,3,1]; // 西(対面)、北(上家)、南(下家)
  for(const idx of displayOrder){
    const row=document.createElement('div');
    row.className='cpu-row';
    // 名前
    const nameEl=document.createElement('div');
    nameEl.className='cpu-name';
    nameEl.textContent=seatName(idx);
    row.appendChild(nameEl);
    // 手牌（裏）
    const tilesEl=document.createElement('div');
    tilesEl.className='cpu-tiles';
    for(let j=0;j<G.hands[idx].length;j++){
      tilesEl.appendChild(tileEl(0,{back:true,mini:true}));
    }
    row.appendChild(tilesEl);
    // 立直
    if(G.riichi[idx]){
      const b=document.createElement('span');
      b.id=`cpu-riichi-${idx}`;
      b.className='riichi-badge';
      b.textContent='立直';
      row.appendChild(b);
    }
    cpusEl.appendChild(row);
  }

  // 捨て牌 (4エリア)
  for(let i=0;i<4;i++){
    const el=document.getElementById(`river-${i}`);
    el.innerHTML='';
    for(const r of G.rivers[i]){
      el.appendChild(tileEl(r.tile,{disabled:true,tsumogiri:r.tsumogiri,riichi:r.riichi}));
    }
    // ラベル更新
    const lbl=document.getElementById(`rlabel-${i}`);
    if(lbl) lbl.textContent=`${i===0?'あなた':seatName(i)} 捨て牌`;
  }

  // プレイヤー手牌
  const phEl=document.getElementById('player-hand');
  phEl.innerHTML='';
  if(G.drawnIsLast&&G.hands[0].length===14){
    const first13=sortHand(G.hands[0].slice(0,13));
    const drawn=G.hands[0][13];
    G.hands[0]=[...first13,drawn];
    for(let i=0;i<13;i++){
      const idx=i;
      phEl.appendChild(tileEl(first13[idx],{onClick:()=>onPlayerDiscard(idx)}));
    }
    const el=tileEl(drawn,{onClick:()=>onPlayerDiscard(13)});
    el.classList.add('drawn');
    phEl.appendChild(el);
  } else {
    G.hands[0]=sortHand(G.hands[0]);
    for(let i=0;i<G.hands[0].length;i++){
      const idx=i;
      phEl.appendChild(tileEl(G.hands[0][idx],{onClick:()=>onPlayerDiscard(idx)}));
    }
  }
}

// ============================================================
// 初期化
// ============================================================
document.getElementById('btn-tsumo').addEventListener('click',onTsumo);
document.getElementById('btn-ron').addEventListener('click',onRon);
document.getElementById('btn-pass').addEventListener('click',onPass);
document.getElementById('btn-riichi').addEventListener('click',onRiichi);

newRound();
</script>
